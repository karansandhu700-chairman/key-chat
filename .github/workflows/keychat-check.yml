name: Key Chat browser checks
on:
  push:
    branches: [project-chat-organization]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install chromium
      - name: Exercise app in desktop and mobile viewports
        run: |
          python3 -m http.server 8765 > /tmp/keychat-server.log 2>&1 &
          node .github/keychat-check.cjs
